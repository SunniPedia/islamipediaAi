  <script>
    (function () {
      function setAppVH() {
        var vv = window.visualViewport;
        var h = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty("--app-vh", h + "px");
      }
      var lastH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      function onViewportResize() {
        var vv = window.visualViewport;
        var h = vv ? vv.height : window.innerHeight;
        setAppVH();
        if (h < lastH - 60) {
          setTimeout(function () {
            var main = document.querySelector("main");
            if (main) main.scrollTop = main.scrollHeight;
          }, 60);
        }
        lastH = h;
      }
      setAppVH();
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", onViewportResize);
        window.visualViewport.addEventListener("scroll", setAppVH);
      }
      window.addEventListener("resize", setAppVH);
      window.addEventListener("orientationchange", function () { setTimeout(setAppVH, 120); });
      document.addEventListener("focusout", function () {
        setTimeout(function () {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        }, 50);
      }, true);
    })();
  </script>
