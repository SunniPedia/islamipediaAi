<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>islamiPediaAI - ইসলামিক এআই সহকারী</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #0b5ed7;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #e9ecef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 25px;
      margin-top: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #0f5132;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    header p {
      color: #6c757d;
      font-size: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 14px;
      border: 1px solid #ced4da;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.15);
    }

    button {
      background-color: #0f5132;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background-color: #0b3e26;
    }

    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .response-card {
      background-color: #f1f8f5;
      border: 1px solid #d1e7dd;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      display: none;
    }

    .response-card h3 {
      color: #0f5132;
      font-size: 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .response-content {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #198754;
    }

    .loader {
      display: none;
      text-align: center;
      margin: 20px 0;
      color: #0f5132;
      font-weight: 500;
    }

    .error-card {
      background-color: #f8d7da;
      border: 1px solid #f5c2c7;
      color: #842029;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      display: none;
    }

    footer {
      margin-top: auto;
      padding: 20px 0;
      text-align: center;
      font-size: 14px;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>islamiPediaAI</h1>
      <p>আপনার সংরক্ষিত ইসলামিক তথ্যভাণ্ডার থেকে উত্তর পাওয়ার সহায়িকা</p>
    </header>

    <div class="input-group">
      <textarea id="userQuery" placeholder="এখানে আপনার প্রশ্নটি লিখুন..."></textarea>
      <button id="submitBtn" onclick="askGemini()">
        <span>উত্তর খুঁজুন</span>
      </button>
    </div>

    <div id="loader" class="loader">
      তথ্য অনুসন্ধান করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...
    </div>

    <div id="errorCard" class="error-card"></div>

    <div id="responseCard" class="response-card">
      <h3>উত্তর:</h3>
      <div id="responseContent" class="response-content"></div>
    </div>
  </div>

  <footer>
    &copy; Sunnipedia | Powered by Gemini 2.5 Flash-Lite
  </footer>

  <script>
    async function askGemini() {
      const queryInput = document.getElementById("userQuery");
      const submitBtn = document.getElementById("submitBtn");
      const loader = document.getElementById("loader");
      const responseCard = document.getElementById("responseCard");
      const responseContent = document.getElementById("responseContent");
      const errorCard = document.getElementById("errorCard");

      const query = queryInput.value.trim();

      if (!query) {
        alert("দয়া করে আপনার প্রশ্নটি লিখুন!");
        return;
      }

      // UI স্টেট আপডেট (Loading Mode)
      submitBtn.disabled = true;
      loader.style.display = "block";
      responseCard.style.display = "none";
      errorCard.style.display = "none";

      try {
        // Vercel Serverless API এ কল পাঠানো
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ query: query })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "সার্ভার থেকে কোনো রেসপন্স পাওয়া যায়নি।");
        }

        // সফলভাবে উত্তর পাওয়া গেলে দেখাবে
        responseContent.innerText = data.answer;
        responseCard.style.display = "block";

      } catch (error) {
        console.error("Error:", error);
        errorCard.innerText = "সমস্যা: " + error.message;
        errorCard.style.display = "block";
      } finally {
        // UI পূর্বের অবস্থায় ফেরানো
        submitBtn.disabled = false;
        loader.style.display = "none";
      }
    }
  </script>

</body>
</html>
