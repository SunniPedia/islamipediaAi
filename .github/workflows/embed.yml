name: Delete all except index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete everything except index.html
        run: |
          # root er shob file/folder list korbo index.html bad diye
          shopt -s extglob
          rm -rf!\(index.html\|.git\|.github\)
          ls -la

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Delete korar moto kichu nai"
          else
            git commit -m "Deleted all files except index.html"
            git push
          fi
