name: Upload Data to Supabase

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @supabase/supabase-js @google/generative-ai

      - name: Run Inline Upload Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e '
          const { createClient } = require("@supabase/supabase-js");
          const { GoogleGenerativeAI } = require("@google/generative-ai");
          const fs = require("fs");

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_KEY;
          const GEMINI_API_KEY = process.env.GEMINI_API_KEY;

          const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false },
            realtime: { enabled: false }
          });

          // API Options সেট করা হয়েছে যাতে v1beta API রাউটিং সঠিকভাবে হয়
          const genAI = new GoogleGenerativeAI(GEMINI_API_KEY);

          // Rate limit এড়াতে ডিলে ফাংশন
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function run() {
            try {
              console.log("ডাটা ফাইল পড়া শুরু হচ্ছে...");
              
              const filePath = "data/your_file.txt";
              
              if (!fs.existsSync(filePath)) {
                throw new Error(`ফাইল পাওয়া যায়নি: ${filePath}`);
              }

              const text = fs.readFileSync(filePath, "utf8");
              const chunks = text.split("\n\n").filter(c => c.trim().length > 0);

              console.log(`মোট ${chunks.length} টি প্যারাগ্রাফ পাওয়া গেছে। ভেক্টর তৈরি হচ্ছে...`);

              // text-embedding-004 সঠিক মডেলে কল করা
              const model = genAI.getGenerativeModel({ model: "text-embedding-004" }, { apiVersion: "v1beta" });

              for (let i = 0; i < chunks.length; i++) {
                const chunkText = chunks[i];
                
                // Embed Content Call
                const result = await model.embedContent(chunkText);
                const embedding = result.embedding.values;

                const { error } = await supabase.from("documents").insert({
                  content: chunkText,
                  embedding: embedding
                });

                if (error) {
                  console.error(`প্যারাগ্রাফ ${i + 1} আপলোডে সমস্যা:`, error.message);
                } else {
                  console.log(`✓ প্যারাগ্রাফ ${i + 1}/${chunks.length} সেভ হয়েছে!`);
                }

                // Rate limit (Quota limit) এড়াতে প্রতি রিকোয়েস্টের পর ১.৫ সেকেন্ডের পজ/ব্রেক
                await sleep(1500);
              }
              console.log("🎉 সব ডাটা সফলভাবে Supabase-এ আপলোড হয়ে গেছে!");
            } catch (err) {
              console.error("পদ্ধতিতে সমস্যা:", err.message);
              process.exit(1);
            }
          }

          run();
          '
